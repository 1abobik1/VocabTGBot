name: Send flashcard

on:
  schedule:
    # ── Card schedule ─────────────────────────────────────────────────────────
    # GitHub cron is in UTC. Moscow time (MSK) = UTC+3, so subtract 3 hours.
    #
    #   "0 7-19/2 * * *"  →  every 2 hours from 07:00 to 19:00 UTC
    #                     →  10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 MSK
    #
    # To change the window: edit "7-19" (first and last UTC hour).
    #   e.g. 09:00–21:00 MSK  →  "6-18"
    # To change the frequency: edit "/2" (every N hours).
    #   e.g. every hour → "0 7-19 * * *", every 3 hours → "0 7-19/3 * * *"
    # Note: GitHub may start scheduled runs 5–30 minutes late under load.
    - cron: "0 7-19/2 * * *"
  workflow_dispatch: {} # "Run workflow" button for a manual card

concurrency:
  group: vocab-kv-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send next card to every user
        run: python scripts/send_cards.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
