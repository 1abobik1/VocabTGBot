name: Send flashcard (manual)

# Scheduled cards are sent by the Cloudflare Worker cron (see worker/wrangler.toml):
# GitHub cron often starts 5–30 minutes late, so it is not used for the card schedule.
# This workflow stays as a manual fallback: Actions → "Send flashcard (manual)" → Run workflow.
# Like the Worker, it skips users whose previous card is still unanswered.

on:
  workflow_dispatch: {}

concurrency:
  group: vocab-kv-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send next card to every user
        run: python scripts/send_cards.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
