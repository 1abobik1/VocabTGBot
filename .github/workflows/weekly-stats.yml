name: Weekly stats (manual)

# The weekly report is sent by the Cloudflare Worker cron (REPORT_DAY / REPORT_TIME in
# worker/wrangler.toml): it includes the AI review of weak spots, and Workers AI is only
# reachable from the Worker. This workflow stays as a manual fallback without the AI review.

on:
  workflow_dispatch: {}

concurrency:
  group: vocab-kv-writer
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send weekly stats to every user
        run: python scripts/weekly_stats.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
